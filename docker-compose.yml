version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: newsletter_db
    environment:
      POSTGRES_USER: newsletter_user
      POSTGRES_PASSWORD: newsletter_password
      POSTGRES_DB: newsletter_saas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsletter_user -d newsletter_saas"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: newsletter_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://newsletter_user:newsletter_password@db:5432/newsletter_saas
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8080,http://localhost:8000
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn backend.api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app

volumes:
  postgres_data:
